# Nginx config for the frontend container.
#  - Serves the built React app (static files).
#  - Acts as a REVERSE PROXY: any request to /api/... is forwarded to the
#    backend container. "backend" is the Docker Compose service name, which
#    Docker's internal DNS resolves to the backend container's IP address.
# Because the browser only ever talks to this one origin, no CORS setup is needed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Teachers can upload materials up to 50 MB (see server/src/middleware/upload.js)
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built JS/CSS files have a hash in their name, so they can be cached for a long time
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: unknown paths (e.g. /dashboard) must return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
